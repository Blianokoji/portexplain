[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portexplain"
version = "1.0.0"
authors = [
  { name="Blessen Eby", email="124340631+Blianokoji@users.noreply.github.com" },
]
description = "Homeserver Port & Self-Hosted Software Intelligence & Socket Audit CLI Tool"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["homelab", "homeserver", "networking", "ports", "docker", "self-hosted"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
portexplain = "portexplain.cli:main"

[tool.setuptools.package-data]
portexplain = ["services.json"]
